name: pggate
on: [pull_request]
permissions:
  contents: read
  pull-requests: write
jobs:
  pggate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: yilinguo121/pggate-action@v0.1.0
        with:
          profile: scale
          # 只擋這個 PR 新增的 finding（--base diff gate）要 Guard key：設 PGGATE_LICENSE_KEY 之後再加 base: ${{ github.base_ref }}；
          # 沒有 key 時不要設 base（會變成 LICENSE_REQUIRED、exit 2）。現在沒有 key，所以每個 fail finding 都擋。
          license-key: ${{ secrets.PGGATE_LICENSE_KEY }}
